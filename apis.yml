aid: aravo
name: Aravo
description: 'Aravo Solutions is a San Francisco based enterprise software company providing
  third-party risk management (TPRM), supplier and procurement risk management, and governance,
  risk and compliance software. Its Intelligence First platform covers vendor nomination and
  intake, onboarding, due diligence, continuous monitoring, contracts, performance management,
  issue remediation and offboarding, with risk-domain applications for anti-bribery and
  corruption, data privacy and GDPR, information security, ESG, DORA and the German Supply
  Chain Due Diligence Act (LkSG). Aravo markets an integration framework that exchanges data
  with ERP, procure-to-pay, accounts payable and GRC systems, and with risk-intelligence
  providers including Refinitiv World-Check One, LexisNexis, Dow Jones, BitSight,
  SecurityScorecard, RapidRatings and Dun & Bradstreet, over SOAP and REST web-services APIs in
  XML and JSON. That API surface is described only on marketing pages; the reference
  documentation sits behind the login-gated Aravo customer portal.'
